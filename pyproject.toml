[project]
name = "first-read"
version = "0.1.0"
description = "Hear your characters speak for the first time."
requires-python = ">=3.12,<3.13"
dependencies = [
  "google-adk>=2.0,<3",
  "google-genai>=1.0",
  "google-cloud-storage>=2.18",
  "mcp-clickhouse>=0.5,<0.6",
  "mcp>=1.24,<2",
  "clickhouse-connect>=0.8",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pillow>=10.4",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
